<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vectura - Raster Studio</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <div id="app-root">
    <!-- Viewport Canvas Container -->
    <div id="viewport-container">
      <canvas id="viewport-canvas"></canvas>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-overlay">
      <!-- Minimalist Slim Top Navigation Bar -->
      <header id="top-bar" class="glass-panel interactive">
        <div class="top-bar-section">
          <button id="btn-home" class="glass-btn glass-btn-icon" title="Projects Gallery">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
          </button>
          <button id="btn-undo" class="glass-btn glass-btn-icon disabled" title="Undo (2-Finger Tap)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
          </button>
          <button id="btn-redo" class="glass-btn glass-btn-icon disabled" title="Redo (3-Finger Tap)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path></svg>
          </button>
          <div id="project-title-display">Artwork 1</div>
        </div>

        <div class="top-bar-section">
          <button id="btn-fit-view" class="glass-btn glass-btn-icon" title="Fit to Screen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          </button>
          <button id="btn-mirror-view" class="glass-btn glass-btn-icon" title="Mirror View">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M20 7l-4 4 4 4M4 7l4 4-4 4"></path></svg>
          </button>
          <button id="btn-export" class="glass-btn glass-btn-icon" title="Export">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          </button>
          <button id="btn-settings" class="glass-btn glass-btn-icon" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button id="btn-toggle-ui" class="glass-btn glass-btn-icon" title="Hide UI">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </header>

      <!-- Minimalist Vertical Edge Sliders (Vertically Centered, Left Edge) -->
      <aside id="edge-sliders" class="interactive">
        <div class="vertical-slider-container">
          <div id="edge-size-dot" class="slider-preview-dot">
            <div class="slider-preview-dot-inner" style="width: 6px; height: 6px;"></div>
          </div>
          <input type="range" id="edge-size-slider" class="vertical-slider" min="1" max="150" value="8" />
          <span id="edge-size-label" class="slider-label">8px</span>
        </div>

        <div class="vertical-slider-container">
          <div id="edge-opacity-dot" class="slider-preview-dot">
            <div class="slider-preview-dot-inner" style="width: 12px; height: 12px; opacity: 1.0;"></div>
          </div>
          <input type="range" id="edge-opacity-slider" class="vertical-slider" min="1" max="100" value="100" />
          <span id="edge-opacity-label" class="slider-label">100%</span>
        </div>
      </aside>

      <!-- Minimalist Bottom Floating Pill Toolbar -->
      <nav id="toolbar" class="glass-panel interactive">
        <button id="tool-btn-brush" class="glass-btn glass-btn-icon active" title="Brush">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path></svg>
        </button>
        <button id="tool-btn-eraser" class="glass-btn glass-btn-icon" title="Eraser">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 20H7L2 15a2 2 0 0 1 0-2.83L13.17 1a2 2 0 0 1 2.83 0l6 6a2 2 0 0 1 0 2.83L14 17"></path><path d="M11 5l7 7"></path></svg>
        </button>
        <button id="tool-btn-bucket" class="glass-btn glass-btn-icon" title="Flood Fill">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 11l-8-8-8.5 8.5a2.12 2.12 0 0 0 0 3l5 5a2.12 2.12 0 0 0 3 0L19 11z"></path><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-4 2-4s2 2.4 2 4z"></path></svg>
        </button>
        <button id="tool-btn-lasso" class="glass-btn glass-btn-icon" title="Lasso Fill">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 22a5 5 0 0 1-2-4c0-3.5 3-6 7-6s7 2.5 7 6a5 5 0 0 1-2 4"></path><path d="M12 2v10"></path></svg>
        </button>
        <button id="tool-btn-more-tools" class="glass-btn glass-btn-icon" title="More Tools">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
        </button>

        <div class="toolbar-separator"></div>

        <!-- Color Button -->
        <button id="tool-btn-color" class="glass-btn glass-btn-icon" title="Color Studio">
          <div id="tool-btn-color-dot" style="width: 22px; height: 22px; border-radius: 50%; background: #8b5cf6; border: 2px solid #ffffff; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>
        </button>

        <!-- Layers Button with Badge -->
        <button id="tool-btn-layers" class="glass-btn glass-btn-icon" title="Layers Stack" style="position: relative;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span id="tool-layers-badge" style="position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary);"></span>
        </button>
      </nav>

      <!-- Minimalist Tools Popover Menu -->
      <div id="tools-popover" class="glass-panel interactive">
        <button id="tool-btn-shape" class="glass-btn glass-btn-icon" title="Shapes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><polygon points="12 8 8 16 16 16"></polygon></svg>
        </button>
        <button id="tool-btn-gradient" class="glass-btn glass-btn-icon" title="Gradient">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="21" x2="21" y2="3"></line></svg>
        </button>
        <button id="tool-btn-text" class="glass-btn glass-btn-icon" title="Text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
        </button>
        <button id="tool-btn-symmetry" class="glass-btn glass-btn-icon" title="Symmetry">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M4 6h8M4 12h8M4 18h8"></path><path d="M20 6h-8M20 12h-8M20 18h-8"></path></svg>
        </button>
      </div>

      <!-- Floating Show UI Button (Visible when UI is hidden) -->
      <button id="btn-show-ui-floating" class="glass-btn glass-btn-icon interactive" style="position: absolute; top: 12px; right: 12px; display: none; z-index: 200;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>

      <!-- Eyedropper Magnifier Ring -->
      <div id="eyedropper-loupe">
        <div id="eyedropper-ring-sample"></div>
        <div id="eyedropper-ring-current"></div>
        <div id="eyedropper-center-cross"></div>
      </div>

      <!-- Bottom Sheets: Layers, Brushes, Color, Tools -->
      <div id="sheet-layers" class="glass-panel glass-sheet interactive">
        <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
        <div class="sheet-header">
          <span class="sheet-title">Layers Stack</span>
          <button class="glass-btn glass-btn-icon sheet-close-btn" style="width: 30px; height: 30px;">✕</button>
        </div>
        <div id="sheet-layers-content" class="sheet-content"></div>
      </div>

      <div id="sheet-brushes" class="glass-panel glass-sheet interactive">
        <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
        <div class="sheet-header">
          <span class="sheet-title">Brush Studio</span>
          <button class="glass-btn glass-btn-icon sheet-close-btn" style="width: 30px; height: 30px;">✕</button>
        </div>
        <div id="sheet-brushes-content" class="sheet-content"></div>
      </div>

      <div id="sheet-color" class="glass-panel glass-sheet interactive">
        <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
        <div class="sheet-header">
          <span class="sheet-title">Color Studio</span>
          <button class="glass-btn glass-btn-icon sheet-close-btn" style="width: 30px; height: 30px;">✕</button>
        </div>
        <div id="sheet-color-content" class="sheet-content"></div>
      </div>

      <div id="sheet-tools" class="glass-panel glass-sheet interactive">
        <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
        <div class="sheet-header">
          <span class="sheet-title">Tool Options</span>
          <button class="glass-btn glass-btn-icon sheet-close-btn" style="width: 30px; height: 30px;">✕</button>
        </div>
        <div id="sheet-tools-content" class="sheet-content"></div>
      </div>

      <!-- Export Modal -->
      <div id="export-modal" class="glass-modal-backdrop">
        <div class="glass-panel glass-modal" style="padding: 18px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <span style="font-size: 15px; font-weight: 700;">Export Artwork</span>
            <button id="exp-close-btn" class="glass-btn glass-btn-icon" style="width: 30px; height: 30px;">✕</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div>
              <button id="exp-btn-png" class="glass-btn glass-btn-cta" style="width: 100%;">PNG Image</button>
              <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 4px; color: var(--text-muted);">
                <input type="checkbox" id="exp-png-trans" /> Transparent Background
              </label>
            </div>
            <button id="exp-btn-jpg" class="glass-btn" style="width: 100%; border: 1px solid var(--glass-border);">JPEG Photo</button>
            <button id="exp-btn-svg" class="glass-btn active" style="width: 100%;">True Vector SVG</button>
            <button id="exp-btn-json" class="glass-btn" style="width: 100%; border: 1px solid var(--glass-border);">Project Backup (.vectura)</button>
          </div>
        </div>
      </div>

      <!-- Settings Modal -->
      <div id="settings-modal" class="glass-modal-backdrop"></div>

      <!-- Tutorial Modal -->
      <div id="tutorial-modal" class="glass-modal-backdrop"></div>
    </div>

    <!-- Home Screen (Projects Gallery) -->
    <div id="home-screen" class="hidden"></div>
  </div>

  <!-- Unified Self-Contained Bundle Script -->
  <script src="js/bundle.js"></script>
</body>
</html>
